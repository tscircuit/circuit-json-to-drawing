<svg xmlns="http://www.w3.org/2000/svg" width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-label="B / Rotor subassembly" style="font-family:monospace"><title>B / Rotor subassembly</title><rect width="100%" height="100%" fill="white"/><g data-drawing-part-view-id="encoder"><title>B1 / BOND DIAMETRIC MAGNET</title><clipPath id="viewport-0"><rect x="11.5" y="20.5" width="130" height="139"/></clipPath><image x="11.5" y="20.5" width="130" height="139" preserveAspectRatio="none" clip-path="url(#viewport-0)" href="data:image/png;base64,"/><text x="76.5" y="163" text-anchor="middle" font-size="2.8">B1 / BOND DIAMETRIC MAGNET · FIT</text></g><g data-drawing-part-view-id="bearing"><title>B2 / SEAT BEARING IN CAP</title><clipPath id="viewport-1"><rect x="155.5" y="20.5" width="130" height="139"/></clipPath><image x="155.5" y="20.5" width="130" height="139" preserveAspectRatio="none" clip-path="url(#viewport-1)" href="data:image/png;base64,"/><text x="220.5" y="163" text-anchor="middle" font-size="2.8">B2 / SEAT BEARING IN CAP · FIT</text></g><rect x="2" y="2" width="293" height="206" fill="none" stroke="black" stroke-width="0.25"/><text x="11.5" y="13" font-size="4.8" fill="#263641">B / BUILD THE ROTOR SUBASSEMBLY</text><text x="11.5" y="20" font-size="2.6" fill="#263641">B1 becomes part of B2. The encoder magnet stays bonded to the cap.</text><text x="11.5" y="201" font-size="2.4" fill="#263641">DRAWING STUDY  /  published geometry 1.0.31  /  offsets illustrative  /  not to scale</text><text x="15.5" y="173" font-size="2.7" fill="#263641">Magnet bonds against the cap&apos;s stop.</text><text x="160.5" y="173" font-size="2.7" fill="#263641">Bearing seats into the cap&apos;s outer fit.</text></svg>